name: LovestGateWay Debian
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  debian:
    runs-on: ubuntu-latest
    container: rust:bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Identify source and version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          BUILD_SHA=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          VERSION=${REQUESTED_VERSION:-dev-$BUILD_SHA}
          case "$VERSION" in *[!A-Za-z0-9._-]*|'') exit 1;; esac
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang libclang-dev cmake perl g++ python3 python3-yaml python3-jsonschema nftables iproute2 systemd util-linux openvpn openssl
          TOOLCHAIN=$(rustup default | cut -d' ' -f1)
          rustup component add rustfmt --toolchain "$TOOLCHAIN"
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: API and contract
        run: |
          python3 scripts/check-public-source.py
          node --test frontend/tests/*.test.mjs
          python3 -m unittest discover -s tests -v
          python3 scripts/export-api-contract.py
          python3 scripts/check-api-contract.py
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- docs/openapi-v1.json integration/fixtures
          sh -n FILES/usr/bin/ppg.sh
          sh -n FILES/usr/bin/nft.sh
          sh -n deploy/debian/install.sh
          sh -n deploy/debian/ppgw-admin
          sh -n deploy/debian/uninstall.sh
          sh -n deploy/debian/runtime.sh
          if [ -f install.sh ]; then sh -n install.sh; fi
      - name: Rust test and build
        working-directory: sniffbox
        env:
          SNIFFBOX_VERSION: ${{ env.RELEASE_VERSION }}
          PPGW_BUILD_COMMIT: ${{ env.BUILD_SHA }}
        run: |
          cargo test --workspace --locked
          cargo build --release --locked -p sniffbox
      - name: Package Debian amd64
        run: |
          SOURCE_SHA=$(python3 scripts/source-manifest.py)
          python3 scripts/package-debian.py --binary sniffbox/target/release/sniffbox --version "$RELEASE_VERSION" --commit "$BUILD_SHA" --source-sha256 "$SOURCE_SHA" --arch amd64
          git -c safe.directory="$GITHUB_WORKSPACE" archive --format=tar.gz --prefix="lovestgateway-$RELEASE_VERSION-source/" --output="dist/lovestgateway-$RELEASE_VERSION-source.tar.gz" HEAD
          if [ -f install.sh ]; then cp install.sh dist/install.sh; fi
          cd dist
          sha256sum "lovestgateway-$RELEASE_VERSION-source.tar.gz" > "lovestgateway-$RELEASE_VERSION-source.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: lovestgateway-debian-amd64
          path: |
            dist/lovestgateway-*.tar.gz*
            dist/install.sh
